# Netlify build + hosting config for Lexee (a Vite single-page app).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: every route is served by index.html so client-side
# routing (React Router) works on refresh and deep links like /explore.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
